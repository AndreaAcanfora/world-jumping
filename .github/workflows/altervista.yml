name: Deploy to Altervista

# Uploads the build to andreaaca.altervista.org over FTPS.
# Altervista accepts FTP only from countries enabled in its panel: GitHub runners are in the USA.
# The game goes to /platform3D/ (the classic 2018 version lives in /platform3D-classic/).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: altervista
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        env:
          PASSWORD: ${{ secrets.ALTERVISTA_FTP_PASSWORD }}
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "ALTERVISTA_FTP_PASSWORD is not set: skipping the upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
        if: steps.creds.outputs.ok == 'true'
      - name: Upload over FTPS (resumes, index.html last)
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/deploy-ftp.mjs dist "${{ vars.DEPLOY_DIR || '/platform3D/' }}"
        env:
          ALTERVISTA_FTP_PASSWORD: ${{ secrets.ALTERVISTA_FTP_PASSWORD }}
          ALTERVISTA_FTP_USER: ${{ vars.ALTERVISTA_FTP_USER || 'andreaaca' }}
