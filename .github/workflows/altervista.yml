name: Deploy to Altervista

# Uploads the build to andreaaca.altervista.org over FTPS.
# While the new game is in preview it goes to /platform3D-next/; set DEPLOY_DIR to
# /platform3D/ (repository variable) when it replaces the classic version.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: altervista
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        env:
          PASSWORD: ${{ secrets.ALTERVISTA_FTP_PASSWORD }}
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "ALTERVISTA_FTP_PASSWORD is not set: skipping the upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
        if: steps.creds.outputs.ok == 'true'
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: steps.creds.outputs.ok == 'true'
        with:
          server: ftp.andreaaca.altervista.org
          username: ${{ vars.ALTERVISTA_FTP_USER || 'andreaaca' }}
          password: ${{ secrets.ALTERVISTA_FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ vars.DEPLOY_DIR || '/platform3D-next/' }}
